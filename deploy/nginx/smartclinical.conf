# EBM SmartClinical – nginx ters vekil
# Sertifika: /etc/nginx/sertifika/{tam_zincir.pem, anahtar.pem} (hastane PKI'sından)

upstream smartclinical_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name smartclinical.hastane.local;

    ssl_certificate     /etc/nginx/sertifika/tam_zincir.pem;
    ssl_certificate_key /etc/nginx/sertifika/anahtar.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Güvenlik başlıkları (sızma testi bulguları SC-PT-2025-03 / 07)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    server_tokens off;

    client_max_body_size 26m;        # TMF belge yükleme: uygulama sınırı 25 MB
    client_body_timeout 60s;

    access_log /var/log/nginx/smartclinical.access.log;
    error_log  /var/log/nginx/smartclinical.error.log warn;

    location /static/ {
        proxy_pass http://smartclinical_app;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    location / {
        proxy_pass http://smartclinical_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;     # BDM çağrıları uzun sürebilir
        proxy_buffering off;
    }

    # Sağlık kontrolü sadece iç ağdan
    location /saglik {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://smartclinical_app;
    }
}
